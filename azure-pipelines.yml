trigger:
- main

pool:
  vmImage: 'windows-2022'

variables:
  solution: '**/*.sln'
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'

jobs:
# Job 1: Install SDK
- job: install_sdk
  displayName: "Install .NET SDK"
  pool:
    vmImage: 'windows-2022'
  steps:
  - task: UseDotNet@2
    inputs:
      packageType: 'sdk'
      version: '8.0.x'    # Use your target .NET version

# Job 2: Restore dependencies
- job: restore
  displayName: "Restore Dependencies"
  dependsOn: install_sdk
  pool:
    vmImage: 'windows-2022'
  steps:
  - task: DotNetCoreCLI@2
    displayName: Restore
    inputs:
      command: 'restore'
      projects: '**/*.csproj'

# Job 3: Build project
- job: build
  displayName: "Build Project"
  dependsOn: restore
  pool:
    vmImage: 'windows-2022'
  steps:
  - task: DotNetCoreCLI@2
    displayName: Build
    inputs:
      command: 'build'
      projects: '**/*.csproj'
      arguments: '--configuration Release'
