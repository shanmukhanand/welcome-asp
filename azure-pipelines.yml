trigger:
- main

variables:
  solution: '**/*.sln'
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'

jobs:
# Job 1: Install SDK
- job: install_sdk
  displayName: "Install .NET SDK"
  pool:
    vmImage: 'Default'
  steps:
  - task: UseDotNet@2
    inputs:
      packageType: 'sdk'
      version: '8.0.x'    # Use your target .NET version