trigger:
  branches:
    include:
      - main

variables:
  - name: solution
    value: '/*.sln'
  - name: buildPlatform
    value: 'Any CPU'
  - name: buildConfiguration
    value: 'Release'
  - name: artifactName
    value: 'webapp'

stages:

# =====================
# Build Stage
# =====================
- stage: Build
  displayName: "Build Stage"
  jobs:
    - job: install_sdk
      displayName: "Install .NET SDK"
      pool:
        name: dotnet-agent   # <-- Self-hosted agent pool
      steps:
        - task: UseDotNet@2
          inputs:
            packageType: 'sdk'
            version: '8.0.x'

    - job: restore
      displayName: "Restore Dependencies"
      dependsOn:
        - install_sdk
      pool:
        name: dotnet-agent
      steps:
        - task: DotNetCoreCLI@2
          displayName: Restore
          inputs:
            command: 'restore'
            projects: '/*.csproj'

    - job: build
      displayName: "Build Project"
      dependsOn:
        - restore
      pool:
        name: dotnet-agent
      steps:
        - task: DotNetCoreCLI@2
          displayName: Build
          inputs:
            command: 'build'
            projects: '/*.csproj'
            arguments: '--configuration $(buildConfiguration)'

# =====================
# Test Stage
# =====================
- stage: Test
  displayName: "Test Stage"
  dependsOn:
    - Build
  jobs:
    - job: run_tests
      displayName: "Run Unit Tests"
      pool:
        name: dotnet-agent
      steps:
        - task: DotNetCoreCLI@2
          displayName: Test
          inputs:
            command: 'test'
            projects: '/*Tests.csproj'
            arguments: '--configuration $(buildConfiguration) --no-build'

# =====================
# Deploy Stage
# =====================
- stage: Deploy
  displayName: "Deploy Stage"
  dependsOn:
    - Test
  jobs:
    - job: publish_artifacts
      displayName: "Publish Artifacts"
      pool:
        name: dotnet-agent
      steps:
        # Publish the web app
        - task: DotNetCoreCLI@2
          displayName: Publish
          inputs:
            command: 'publish'
            projects: '/*.csproj'
            arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)'

        # Publish pipeline artifacts
        - task: PublishBuildArtifacts@1
          displayName: "Publish Pipeline Artifacts"
          inputs:
            artifactName: $(artifactName)
            targetPath: '$(Build.ArtifactStagingDirectory)'

        # =====================
        # Deploy to Azure VM using WinRM/SSH
        # =====================
        - task: CopyFilesOverSSH@0
          displayName: "Copy files to Azure VM"
          inputs:
            sshEndpoint: 'MyVM-SSH-ServiceConnection'
            sourceFolder: '$(Build.ArtifactStagingDirectory)'
            targetFolder: 'C:\inetpub\wwwroot\mywebsite'
            cleanTargetFolder: true

        - task: IISWebAppManagementOnMachineGroup@0
          displayName: "Restart IIS Website"
          inputs:
            Action: 'Start IIS Website'
            WebSiteName: 'Default Web Site'

        # =====================
        # Optional: Deploy as Docker container
