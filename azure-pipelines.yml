        #- script: |
        #    docker stop mywebsite || true
        #    docker rm mywebsite || true
        #    docker build -t mywebsite:latest $(Build.ArtifactStagingDirectory)
        #    docker run -d -p 80:80 --name mywebsite mywebsite:latest
        #  displayName: "Build and run web app in Docker container"
