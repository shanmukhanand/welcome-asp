trigger:
- main

variables:
  solution: '**/*.sln'
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'

jobs:
# Job 1: Install SDK
- job: install_sdk
  displayName: "Install .NET SDK"
  pool:
    name: 'Default'   # Use Default pool where your self-hosted agent lives
    demands:
      - agent.name -equals dotnet-vm-admin
  steps:
  - task: UseDotNet@2
    inputs:
      packageType: 'sdk'
      version: '8.0.x'    # Use your target .NET version
