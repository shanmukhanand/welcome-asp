# ASP.NET Core (.NET Framework)
# Build and test ASP.NET Core projects targeting the full .NET Framework.
# Add steps that publish symbols, save build artifacts, and more: testing
# https://docs.microsoft.com/azure/devops/pipelines/languages/dotnet-core

trigger:
- main

pool:
  vmImage: 'windows-2022'

variables:
  solution: '**/*.sln'
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'

steps:
# Step 1: Install .NET SDK
- task: UseDotNet@2
  inputs:
    packageType: 'sdk'
    version: '8.0.x'    # Use your target .NET version

# Step 2: Restore dependencies (no .sln needed)
- task: DotNetCoreCLI@2
  displayName: Restore
  inputs:
    command: 'restore'
    projects: '**/*.csproj'

# Step 3: Build project
- task: DotNetCoreCLI@2
  displayName: Build
  inputs:
    command: 'build'
    projects: '**/*.csproj'
    arguments: '--configuration Release'

# Step 4: Run application in background
- powershell: |
    Start-Process "dotnet" "run --project $(Build.SourcesDirectory)\YourProjectFolder\YourProject.csproj --configuration Release --urls http://localhost:5000" -NoNewWindow
    Start-Sleep -Seconds 10   # wait for the app to start
  displayName: Run Application (background)

# Step 5: Test the application endpoint
- powershell: |
    $response = Invoke-WebRequest -Uri "http://localhost:5000" -UseBasicParsing
    if ($response.StatusCode -eq 200) {
        Write-Host "✅ Application is running and returned HTTP 200 OK"
    } else {
        Write-Error "❌ Application returned status code $($response.StatusCode)"
    }
  displayName: Test Application Endpoint